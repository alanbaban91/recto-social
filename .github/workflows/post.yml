name: Post to Threads (Recto)

on:
  # Triggered by cron-job.org at 08:00, 10:30, 13:00, 15:30, 20:00 and 22:30 Baghdad time
  # (exact timing; GitHub's own schedule runs late). The 7th post is post-photos.yml at 18:00.
  workflow_dispatch: {}   # lets you trigger a post manually

permissions:
  contents: write

concurrency:
  group: recto-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Restore the Recto brand font
        env:
          BRAND_FONT_B64: ${{ secrets.BRAND_FONT_B64 }}
        run: '[ -z "$BRAND_FONT_B64" ] || echo "$BRAND_FONT_B64" | base64 -d > fonts/GCCommune.otf'

      - name: Render cards (image posts only)
        run: python3 post.py render

      - name: Upload cards so Threads can fetch them
        run: |
          git config user.name "recto-bot"
          git config user.email "recto-bot@users.noreply.github.com"
          git add media
          git diff --cached --quiet || git commit -m "Render cards"
          git pull --rebase && git push

      - name: Publish to Threads
        run: python3 post.py publish
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}

      - name: Save updated queue
        if: always()
        run: |
          git add -A queue.json posted.json media
          git diff --cached --quiet || git commit -m "Posted to Threads"
          git pull --rebase && git push
