name: Reply to comments (Recto)

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recto-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Answer new comments on Threads and Instagram
        run: python3 replies.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN }}

      - name: Remember answered comments
        if: always()
        run: |
          git config user.name "recto-bot"
          git config user.email "recto-bot@users.noreply.github.com"
          git add replied.json $(ls replies-log.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Answered comments"
          git pull --rebase && git push
